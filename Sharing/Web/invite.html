<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EZ Share · P2Pで送る</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6fa;--card:#fff;--text:#172033;--sub:#526071;--border:#d6dce6;--accent:#2563eb}@media(prefers-color-scheme:dark){:root{--bg:#11151b;--card:#1a2029;--text:#f3f6fa;--sub:#aeb9c8;--border:#3a4656}}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,'Yu Gothic UI',sans-serif}main{max-width:780px;margin:6vh auto;padding:24px}.brand{color:#669aff;letter-spacing:.15em;font-size:12px;font-weight:800}h1{font-size:30px;margin:8px 0}p{color:var(--sub)}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;margin:20px 0}input{background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:11px;font:inherit;max-width:100%;margin:8px 8px 8px 0}button{background:var(--accent);color:white;border:0;border-radius:9px;padding:11px 17px;font:inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}progress{width:100%;height:14px;accent-color:var(--accent)}#message{white-space:pre-wrap}footer{font-size:12px;color:var(--sub);margin-top:22px}.pill{display:inline-block;padding:3px 10px;border-radius:20px;background:#dcfce7;color:#14532d;font-size:12px;font-weight:700}@media(prefers-color-scheme:dark){.pill{background:#123523;color:#a7f3d0}}:focus-visible{outline:3px solid #70a3ff;outline-offset:4px}[hidden]{display:none!important}
</style>
<main><div class="brand">EZ CONVERTER / DIRECT SEND</div><h1>P2Pでファイルを送る</h1><p><span class="pill">ファイル本体は端末間で直接通信</span></p><section class="card"><p id="message" role="status">送信先PCとの直接接続を準備しています...</p><div id="pickerArea" hidden><label>表示名 <input id="sender" value="ブラウザーのゲスト" maxlength="64"></label><p>送信するファイル・フォルダーを選択してください。</p><label>ファイル <input id="files" type="file" multiple></label><label>フォルダー <input id="folder" type="file" multiple webkitdirectory></label><p id="selection"></p><button id="send" disabled>送信する</button><button id="cancel" disabled>キャンセル</button></div><progress id="progress" max="100" value="0"></progress><p id="detail"></p></section><footer>Google／CloudflareのSTUNが接続候補の確認に使われ、外部IPアドレスが各サービスに見える場合があります。送信先のPCで受信が許可されるまで転送は始まりません。Cloudflare TunnelとSTUNへファイル本体を送ることはありません。</footer></main>
<script src="/ice.js"></script><script src="/transfer-window.js"></script><script src="/sha256.js"></script><script src="/invite.js" defer></script></html>
