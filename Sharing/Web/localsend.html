<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ファイルを受け取る · LocalSend</title>
  <style>
    :root{font-family:system-ui,"Segoe UI",sans-serif;color-scheme:light dark;--bg:#10151d;--card:#1b2430;--line:#344253;--text:#f3f6fb;--muted:#b9c5d4;--blue:#3478f6}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(760px,100%);background:var(--card);border:1px solid var(--line);border-radius:18px;padding:clamp(22px,5vw,42px);box-shadow:0 20px 60px #0005}
    h1{font-size:clamp(1.5rem,4vw,2rem);margin:0 0 8px}p{color:var(--muted);line-height:1.6}#status{min-height:1.6em;margin:16px 0}
    #pin-form{display:none;gap:10px;align-items:end;margin:20px 0}label{display:grid;gap:7px;color:var(--muted);flex:1}input,button{font:inherit;border-radius:9px;padding:11px 13px}input{color:var(--text);background:#111923;border:1px solid var(--line);letter-spacing:.12em}button{color:white;background:var(--blue);border:0;font-weight:650;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    #bulk-download{margin:20px 0 0}#bulk-download[hidden]{display:none}#bulk-download a{display:inline-block;color:white;background:var(--blue);border-radius:9px;padding:11px 15px;font-weight:700;text-decoration:none}
    ul{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:10px}li{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:13px 14px;border:1px solid var(--line);border-radius:10px}li a{color:#9fc2ff;font-weight:650;white-space:nowrap}.file-info{min-width:0}.file-name{overflow-wrap:anywhere;font-weight:600}.file-size{color:var(--muted);font-size:.88rem;margin-top:4px}
    @media(max-width:520px){#pin-form{align-items:stretch;flex-direction:column}li{align-items:flex-start;flex-direction:column}li a{white-space:normal}}
  </style>
</head>
<body>
  <main>
    <h1>ファイルを受け取る</h1>
    <p id="sender">送信元に接続しています…</p>
    <div id="status" role="status" aria-live="polite">LocalSend互換の一時共有に接続しています。</div>
    <form id="pin-form">
      <label>6桁のPIN（送信元から受け取ってください）<input id="pin" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></label>
      <button id="pin-button" type="submit">確認</button>
    </form>
    <div id="bulk-download" hidden><a id="download-all">すべてをまとめてダウンロード（ZIP・フォルダー構造を保持）</a></div>
    <ul id="files" aria-label="共有ファイル"></ul>
  </main>
  <script src="/localsend.js" defer></script>
</body>
</html>
